version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    restart: always
    environment:
      POSTGRES_USER: reachinbox_user
      POSTGRES_PASSWORD: reachinbox_password
      POSTGRES_DB: reachinbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox_user -d reachinbox_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: reachinbox-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - BACKEND_URL=http://localhost:5000
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=postgresql://reachinbox_user:reachinbox_password@postgres:5432/reachinbox_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/auth/google/callback}
      - SESSION_SECRET=${SESSION_SECRET:-reachinbox_prod_session_secret_32_chars_long}
      - JWT_SECRET=${JWT_SECRET:-reachinbox_prod_jwt_secret_32_chars_long}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - ETHEREAL_HOST=${ETHEREAL_HOST:-smtp.ethereal.email}
      - ETHEREAL_PORT=${ETHEREAL_PORT:-587}
      - ETHEREAL_USER=${ETHEREAL_USER}
      - ETHEREAL_PASS=${ETHEREAL_PASS}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}
      - SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI:-http://localhost:5000/api/slack/callback}
      - WORKER_CONCURRENCY=5
      - MIN_DELAY_BETWEEN_EMAILS_MS=2000
      - MAX_EMAILS_PER_HOUR_PER_SENDER=200
    ports:
      - "5000:5000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: reachinbox-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://reachinbox_user:reachinbox_password@postgres:5432/reachinbox_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - ETHEREAL_HOST=${ETHEREAL_HOST:-smtp.ethereal.email}
      - ETHEREAL_PORT=${ETHEREAL_PORT:-587}
      - ETHEREAL_USER=${ETHEREAL_USER}
      - ETHEREAL_PASS=${ETHEREAL_PASS}
      - WORKER_CONCURRENCY=5
      - MIN_DELAY_BETWEEN_EMAILS_MS=2000
      - MAX_EMAILS_PER_HOUR_PER_SENDER=200

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reachinbox-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  es_data:
